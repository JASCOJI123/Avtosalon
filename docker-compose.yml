services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: autosalon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d autosalon"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
volumes:
  pgdata:
